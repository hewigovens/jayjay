<!doctype html>
<html lang="en" class="jayjay-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>JayJay Diff — review GitHub pull requests without losing your place</title>
    <meta
      name="description"
      content="Review any public GitHub pull request or comparison in the browser. Review marks survive force-pushes: after a rebase, only the hunks that changed come back for review."
    />
  </head>
  <body>
    <div id="root">
      <main aria-busy="true">
        <div class="landing">
          <div class="landing-wrap landing-hero">
            <h1><img src="/favicon.svg" alt="" width="28" height="28" />JayJay Diff</h1>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
