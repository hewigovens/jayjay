[package]
name = "jj-diff-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "export-web-labels"
path = "src/bin/export_web_labels.rs"

[[bin]]
name = "export-web-grammars"
path = "src/bin/export_web_grammars.rs"

[dependencies]
jayjay-i18n = { path = "../../../crates/jayjay-i18n" }
jayjay-markdown = { path = "../../../crates/jayjay-markdown", default-features = false }
jj-diff = { path = "../../../crates/jj-diff" }
jayjay-primitives = { path = "../../../crates/jayjay-primitives" }
jayjay-review = { path = "../../../crates/jayjay-review", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.129"

[target.'cfg(target_family = "wasm")'.dependencies]
tree-sitter.workspace = true
tree-sitter-language.workspace = true

[lints]
workspace = true
