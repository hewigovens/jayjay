name: SSH helpers

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ssh-helper.sh"
      - ".github/workflows/ssh-helpers.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ssh-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name || matrix.targets }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job for both, since macOS runners are the scarce ones.
          - name: apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            runner: macos-26
          - targets: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - targets: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - targets: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - targets: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - name: Build and pack helpers
        shell: bash
        env:
          HELPER_TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${HELPER_TARGETS//,/ }; do
            bash scripts/ssh-helper.sh "$target" release
            tar -czf "ssh-helper-$target.tgz" -C build/ssh-helpers "$target"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-helper-${{ matrix.name || matrix.targets }}
          path: ssh-helper-*.tgz
          if-no-files-found: error
