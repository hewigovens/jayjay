name: SSH helpers

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ssh-helper.sh"
      - ".github/workflows/ssh-helpers.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ssh-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ssh-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and pack helper
        env:
          HELPER_TARGET: ${{ matrix.target }}
        run: |
          bash scripts/ssh-helper.sh "$HELPER_TARGET" release
          tar -czf "ssh-helper-$HELPER_TARGET.tgz" -C build/ssh-helpers "$HELPER_TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-helper-${{ matrix.target }}
          path: ssh-helper-*.tgz
          if-no-files-found: error
