name: Announce release

on:
  release:
    types: [published]

permissions: {}

jobs:
  discord:
    name: Post to Discord announcements
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Post the release
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_ANNOUNCEMENTS_WEBHOOK is not set"
            exit 1
          fi
          highlights=$(printf '%s' "$RELEASE_BODY" | grep -o '<h2>[^<]*</h2>' | sed -e 's/<[^>]*>//g' -e 's/&amp;/\&/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/^/• /' || true)
          description="Update from JayJay, or download it from the [release page]($RELEASE_URL)."
          if [ -n "$highlights" ]; then
            description=$(printf "**What's new**\n%s\n\n%s" "$highlights" "$description")
          fi
          jq -n --arg title "JayJay ${TAG_NAME#v}" --arg url "$RELEASE_URL" --arg description "$description" \
            '{allowed_mentions: {parse: []}, embeds: [{title: $title, url: $url, description: $description, color: 5793266}]}' |
            curl -fsS -H 'Content-Type: application/json' --data-binary @- "$WEBHOOK_URL?wait=true" >/dev/null
