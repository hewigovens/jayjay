name: AppImage (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dist/arch/**"
      - ".github/workflows/appimage.yml"
  # PRs build only when packaging inputs change; code-only PRs are already compile-covered by GPUI CI's Linux job.
  pull_request:
    paths:
      - "docs/icon.svg"
      - "dist/appimage/**"
      - "dist/arch/**"
      - "shell/gpui/linux/**"
      - ".github/workflows/appimage.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-package:
    name: Arch package lifecycle (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install job and package dependencies
        # makepkg refuses to build unless every runtime dependency is installed; vulkan-swrast satisfies the vulkan-driver virtual.
        run: |
          source dist/arch/PKGBUILD
          pacman --disable-sandbox -Syu --needed --noconfirm \
            git desktop-file-utils appstream vulkan-swrast "${depends[@]}"

      - name: Build, install, upgrade, and remove
        run: |
          useradd --create-home builder
          chown -R builder:builder dist/arch
          cd dist/arch
          runuser -u builder -- makepkg --printsrcinfo >/tmp/generated.SRCINFO
          diff -u .SRCINFO /tmp/generated.SRCINFO
          runuser -u builder -- makepkg --noconfirm
          package=$(find . -maxdepth 1 -name "jayjay-appimage-*.pkg.tar.zst" -print -quit)
          pacman -U --noconfirm "$package"
          test -L /usr/bin/jayjay-gpui
          test -L /usr/bin/jayjay
          test -f /usr/share/applications/dev.hewig.JayJay.desktop
          test -f /usr/share/metainfo/dev.hewig.JayJay.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          test -f /usr/share/licenses/jayjay-appimage/LICENSE
          desktop-file-validate /usr/share/applications/dev.hewig.JayJay.desktop
          appstreamcli validate --no-net /usr/share/metainfo/dev.hewig.JayJay.metainfo.xml
          sed -i "s/^pkgrel=1$/pkgrel=2/" PKGBUILD
          runuser -u builder -- makepkg --noconfirm --force
          upgrade=$(find . -maxdepth 1 -name "jayjay-appimage-*-2-*.pkg.tar.zst" -print -quit)
          pacman -U --noconfirm "$upgrade"
          pacman -Q jayjay-appimage | grep -q -- "-2$"
          pacman -R --noconfirm jayjay-appimage
          test ! -e /usr/bin/jayjay-gpui
          test ! -e /usr/bin/jayjay
          test ! -e /opt/jayjay-appimage/JayJay.AppImage
          test ! -e /usr/share/applications/dev.hewig.JayJay.desktop
          test ! -e /usr/share/metainfo/dev.hewig.JayJay.metainfo.xml
          test ! -e /usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          test ! -e /usr/share/licenses/jayjay-appimage/LICENSE

  metadata:
    # Runs on the newest image because Ubuntu 22.04's AppStream 0.15 rejects the vcs-browser URL type.
    name: Validate Linux metadata
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate desktop entry and metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          desktop-file-validate shell/gpui/linux/dev.hewig.JayJay.desktop
          appstreamcli validate --no-net shell/gpui/linux/dev.hewig.JayJay.metainfo.xml

  appimage:
    name: Build AppImage (${{ matrix.arch }}-linux)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    # Ubuntu 20.04 (glibc 2.31) keeps the binary loadable on Debian 11 and Raspberry Pi OS bullseye; Vulkan, Wayland, and X11 still come from the host.
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # Containers have no /dev/fuse.
      APPIMAGE_EXTRACT_AND_RUN: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install Linux deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            squashfs-tools librsvg2-bin

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Build jayjay-gpui
        run: cargo build --release --locked -p jayjay-gpui

      - name: Build AppImage
        run: dist/appimage/build.sh target/release/jayjay-gpui ${{ matrix.arch }} out

      - name: Inspect AppImage metadata
        run: |
          rm -rf squashfs-root
          ./out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage --appimage-extract >/tmp/jayjay-appimage-extract.log
          test -f squashfs-root/dev.hewig.JayJay.desktop
          test -f squashfs-root/.DirIcon
          test -f squashfs-root/usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/dev.hewig.JayJay.png
          grep -q '#3B82F6' squashfs-root/usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          grep -q '^Exec=jayjay-gpui %F$' squashfs-root/dev.hewig.JayJay.desktop
          grep -q '^Icon=dev.hewig.JayJay$' squashfs-root/dev.hewig.JayJay.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: out/
          retention-days: 14

  smoke:
    # The container's Mesa 21 Lavapipe cannot present to Xvfb, so the launch check runs on the host image.
    name: Smoke test AppImage (${{ matrix.arch }}-linux)
    needs: appimage
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb x11-utils libxkbcommon-x11-0

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: out

      - name: Smoke test with the host Vulkan loader
        run: |
          chmod +x out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          dist/appimage/smoke.sh out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage

  arch-smoke:
    # Arch ICD manifests name drivers by bare file name, which is what broke the Nix bundle (#204).
    name: Smoke test AppImage on Arch (x86_64)
    needs: appimage
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      # Containers have no /dev/fuse.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install runtime dependencies
        run: |
          pacman --disable-sandbox -Syu --needed --noconfirm \
            fontconfig gcc-libs libxcb libxkbcommon libxkbcommon-x11 vulkan-icd-loader vulkan-swrast wayland \
            xorg-server-xvfb xorg-xwininfo ttf-dejavu

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jayjay-gpui-x86_64-linux.AppImage
          path: out

      - name: Smoke test
        run: |
          chmod +x out/jayjay-gpui-x86_64-linux.AppImage
          dist/appimage/smoke.sh out/jayjay-gpui-x86_64-linux.AppImage

  release-assets:
    name: Publish AppImage release assets
    if: github.event_name == 'release'
    needs: [appimage, smoke, arch-smoke, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/appimage
          merge-multiple: true

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repo made explicit.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          ls -lh dist/appimage
          gh release upload "$TAG_NAME" \
            dist/appimage/*.AppImage \
            dist/appimage/*.AppImage.sha256 \
            --clobber
