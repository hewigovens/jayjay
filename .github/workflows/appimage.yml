name: AppImage (Linux, nix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build AppImage
        run: nix build --print-build-logs .#appimage

      - name: Stage artifact
        run: |
          mkdir -p out
          cp -L result out/jayjay-gpui-x86_64.AppImage
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jayjay-gpui-x86_64.AppImage
          path: out/jayjay-gpui-x86_64.AppImage
          retention-days: 14
