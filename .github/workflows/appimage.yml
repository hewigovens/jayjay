name: AppImage (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dist/arch/**"
      - ".github/workflows/appimage.yml"
  # PRs build only when packaging inputs change; code-only PRs are already compile-covered by GPUI CI's Linux job.
  pull_request:
    paths:
      - "docs/icon.svg"
      - "dist/appimage/**"
      - "dist/arch/**"
      - "shell/gpui/linux/**"
      - ".github/workflows/appimage.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-package:
    name: Arch package lifecycle (x86_64)
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install job and package dependencies
        # makepkg refuses to build unless every runtime dependency is installed; vulkan-swrast satisfies the vulkan-driver virtual.
        run: |
          source dist/arch/PKGBUILD
          pacman --disable-sandbox -Syu --needed --noconfirm \
            git desktop-file-utils appstream vulkan-swrast "${depends[@]}"

      - name: Build, install, upgrade, and remove
        run: dist/arch/lifecycle.sh

  appimage:
    name: Build AppImage (${{ matrix.arch }}-linux)
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ${{ matrix.runner }}
    # Ubuntu 20.04 (glibc 2.31) keeps the binary loadable on Debian 11 and Raspberry Pi OS bullseye; Vulkan, Wayland, and X11 still come from the host.
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # Containers have no /dev/fuse.
      APPIMAGE_EXTRACT_AND_RUN: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install Linux deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            squashfs-tools librsvg2-bin

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Build jayjay-gpui
        run: cargo build --release --locked -p jayjay-gpui

      - name: Build AppImage
        run: dist/appimage/build.sh target/release/jayjay-gpui ${{ matrix.arch }} out

      - name: Inspect AppImage metadata
        run: |
          rm -rf squashfs-root
          ./out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage --appimage-extract >/tmp/jayjay-appimage-extract.log
          test -f squashfs-root/dev.hewig.JayJay.desktop
          test -f squashfs-root/.DirIcon
          test -f squashfs-root/usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/dev.hewig.JayJay.png
          grep -q '#3B82F6' squashfs-root/usr/share/icons/hicolor/scalable/apps/dev.hewig.JayJay.svg
          grep -q '^Exec=jayjay-gpui %F$' squashfs-root/dev.hewig.JayJay.desktop
          grep -q '^Icon=dev.hewig.JayJay$' squashfs-root/dev.hewig.JayJay.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: out/
          retention-days: 14

  smoke:
    # The build container's Mesa cannot present to Xvfb, so this runs on the host image.
    name: Smoke test AppImage (${{ matrix.arch }}-linux)
    needs: appimage
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb x11-utils libxkbcommon-x11-0 appstream desktop-file-utils

      - name: Validate desktop entry and metainfo
        run: |
          desktop-file-validate shell/gpui/linux/dev.hewig.JayJay.desktop
          appstreamcli validate --no-net shell/gpui/linux/dev.hewig.JayJay.metainfo.xml

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: out

      - name: Reuse an AppImage already attached to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        # On a rerun the attached AppImage is canonical.
        run: |
          name=jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          if gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            gh release download "$TAG_NAME" -p "$name" -D out --clobber
            (cd out && sha256sum "$name" >"$name.sha256")
            echo "reusing the attached $name"
          fi

      - name: Replace the artifact with the canonical AppImage
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: out/
          overwrite: true
          retention-days: 14

      - name: Smoke test with the host Vulkan loader
        run: |
          chmod +x out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          dist/appimage/smoke.sh out/jayjay-gpui-${{ matrix.arch }}-linux.AppImage

  release-assets:
    name: Publish AppImage release assets
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: [appimage, smoke, arch-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/appimage
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repo made explicit.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        # Assets are attached once and never replaced.
        run: |
          attached=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          for asset in dist/appimage/*.AppImage dist/appimage/*.AppImage.sha256; do
            if grep -qx "$(basename "$asset")" <<<"$attached"; then
              echo "$(basename "$asset") is already attached"
            else
              gh release upload "$TAG_NAME" "$asset"
            fi
          done

  arch-build:
    name: Build Arch package (${{ matrix.arch }})
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || github.event_name == 'workflow_dispatch'
    needs: [appimage, smoke]
    runs-on: ${{ matrix.runner }}
    # Digest-pinned; bump with `docker manifest inspect <image>:base-devel`.
    container: ${{ matrix.container }}
    env:
      # Containers have no /dev/fuse.
      APPIMAGE_EXTRACT_AND_RUN: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # The official archlinux image is x86_64-only; this one tracks Arch Linux ARM.
            container: menci/archlinuxarm:base-devel@sha256:f7c6f64c0f246f41775e01793340c49f8e9abf3991141c25405361d56b100ccb
    steps:
      - name: Install job dependencies
        run: pacman --disable-sandbox -Syu --needed --noconfirm git xorg-server-xvfb xorg-xwininfo ttf-dejavu

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install package runtime dependencies
        # makepkg refuses to build unless every runtime dependency is installed; vulkan-swrast satisfies the vulkan-driver virtual.
        run: |
          source dist/arch/PKGBUILD
          pacman --disable-sandbox -S --needed --noconfirm vulkan-swrast "${depends[@]}"

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          path: dist/arch

      - name: Smoke test the AppImage on Arch
        # Arch ICD manifests name drivers by bare file name, which is what broke the Nix bundle (#204).
        run: |
          chmod +x dist/arch/jayjay-gpui-${{ matrix.arch }}-linux.AppImage
          dist/appimage/smoke.sh dist/arch/jayjay-gpui-${{ matrix.arch }}-linux.AppImage

      - name: Build the package
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: dist/arch/build-package.sh "${{ matrix.arch }}" "$TAG_NAME"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jayjay-appimage-${{ matrix.arch }}.pkg
          path: dist/arch/jayjay-appimage-*.pkg.tar.zst
          retention-days: 14

  arch-publish:
    # The only job with write credentials.
    name: Publish Arch package (${{ matrix.arch }})
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: [arch-build, release-assets]
    runs-on: ubuntu-latest
    # Digest-pinned; bump with `docker manifest inspect archlinux:base-devel`.
    container: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Install job dependencies
        run: pacman --disable-sandbox -Syu --needed --noconfirm git github-cli rclone

      # The publishing code comes from main, not from the released tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "release commit is not on main yet; push main and rerun this job" >&2; exit 1; }

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jayjay-appimage-${{ matrix.arch }}.pkg
          path: packages

      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        # On a rerun the attached package is canonical.
        run: |
          package=$(find packages -name 'jayjay-appimage-*.pkg.tar.zst' -print -quit)
          name=$(basename "$package")
          if gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -qx "$name"; then
            echo "$name is already attached; publishing the attached bytes"
            gh release download "$TAG_NAME" -p "$name" -D attached
            package="attached/$name"
          else
            gh release upload "$TAG_NAME" "$package"
          fi
          echo "package=$package" >>"$GITHUB_ENV"

      - name: Publish to the pacman repo
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: dist/arch/publish-repo.sh "$package" "r2:jayjay-packages/arch/${{ matrix.arch }}"
