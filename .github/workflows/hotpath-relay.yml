name: Benchmark relay

on:
  workflow_run:
    workflows: ["Benchmark"] # the `name:` of the benchmark workflow
    types: [completed]

permissions: {} # jobs get only what they declare

jobs:
  relay:
    # only successful pull request runs have a report; the action checks this too
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the matrix in hotpath-benchmark.yml.
        scenario: [warm, expand, wrap, sbs]
    permissions:
      actions: read # download the artifact of the benchmark run
      id-token: write # authenticate the upload
      pull-requests: read # find the pull request the run belongs to
    concurrency: # a newer run of the same scenario and branch supersedes an older one
      group: hotpath-relay-${{ matrix.scenario }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@v1.0.0
        with:
          benchmark: jj-diff-${{ matrix.scenario }}
          artifact_name: hotpath-report-${{ matrix.scenario }}
          report_file: report.json
