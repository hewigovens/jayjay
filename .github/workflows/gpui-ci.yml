name: GPUI CI

on:
  push:
    branches: [main]
    paths:
      - "shell/gpui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gpui-ci.yml"
  pull_request:
    paths:
      - "shell/gpui/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gpui-ci.yml"

permissions:
  contents: read

concurrency:
  group: gpui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-gpui-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-gpui-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  windows:
    name: Rust (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-gpui-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-gpui-${{ runner.os }}-

      - name: Build jayjay-gpui
        run: cargo build -p jayjay-gpui
