name: Windows CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dist/windows/**"
      - "dist/licenses.hbs"
      - ".github/workflows/windows-portable.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0-${{ matrix.target }}

      - name: Install jj for the extracted CLI test
        env:
          JJ_VERSION: v0.47.1
          RUST_TARGET: ${{ matrix.target }}
        run: |
          Invoke-WebRequest "https://github.com/jj-vcs/jj/releases/download/$env:JJ_VERSION/jj-$env:JJ_VERSION-$env:RUST_TARGET.zip" -OutFile "$env:RUNNER_TEMP/jj.zip"
          Expand-Archive "$env:RUNNER_TEMP/jj.zip" "$env:RUNNER_TEMP/jj-bin"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/jj-bin"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-portable-${{ matrix.arch }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install pinned license generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked

      - name: Download the SSH helper manifest
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        # The macOS publish uploads it just after creating the release.
        run: |
          foreach ($attempt in 1..60) {
            try { Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME/ssh-helpers.json" -OutFile ssh-helpers.json; break } catch { Start-Sleep 30 }
          }
          $manifest = Get-Content -Raw ssh-helpers.json | ConvertFrom-Json
          if (-not ($manifest.PSObject.Properties.Value.url -like "*/$env:TAG_NAME/*")) { throw "ssh-helpers.json does not belong to $env:TAG_NAME" }

      - name: Build portable ZIP and MSIX
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          JAYJAY_PRERELEASE: ${{ contains(github.event.release.tag_name || github.ref_name, '-beta') && '1' || '' }}
          SSH_HELPERS: ${{ github.event_name == 'release' && 'ssh-helpers.json' || '' }}
        run: ./dist/windows/build.ps1 -Version ($env:TAG_NAME -replace '^v', '') -SshHelpers $env:SSH_HELPERS -Architecture ${{ matrix.arch }}

      - name: Check the bundled SSH helper manifest
        if: github.event_name == 'release'
        run: if (-not (Test-Path build/windows-payload/ssh-helpers/manifest.json)) { throw "The release payload has no SSH helper manifest" }

      - name: Verify extracted ZIP
        run: ./dist/windows/smoke.ps1 -Archive (Get-ChildItem build/windows/*.zip | Select-Object -ExpandProperty FullName)

      - name: Hand the ZIP to the publish job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-${{ matrix.arch }}
          path: build/windows/*.zip*
          if-no-files-found: error
          retention-days: 1

      - name: Hand the MSIX to the store job
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix-${{ matrix.arch }}
          path: build/windows/*.msix
          if-no-files-found: error
          retention-days: 1

  store:
    # Each Store submission needs a higher package version, so only stable releases go to the Store.
    name: Submit to the Microsoft Store
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')
    needs: [portable, publish]
    runs-on: windows-2025
    steps:
      - name: Download MSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msix-x64
          path: packages

      - name: Install the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Submit the MSIX for certification
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { throw 'msstore reconfigure failed' }
          $msix = Get-ChildItem packages/*.msix | Select-Object -ExpandProperty FullName
          msstore publish $msix --appId 9PJRQ1HG25VB
          if ($LASTEXITCODE) { throw 'msstore publish failed' }

  publish:
    # The only job with write credentials.
    name: Publish Windows package
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      # The publishing code comes from main, not from the released tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "release commit is not on main yet; push main and rerun this job" >&2; exit 1; }

      - name: Download portable ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-portable-*
          merge-multiple: true
          path: packages

      - name: Attach the ZIP to the release
        # On a rerun the attached ZIP and checksum are canonical.
        run: |
          attached=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          for asset in packages/*.zip packages/*.zip.sha256; do
            name=$(basename "$asset")
            if grep -qx "$name" <<<"$attached"; then
              gh release download "$TAG_NAME" -p "$name" -D packages --clobber
            else
              gh release upload "$TAG_NAME" "$asset"
            fi
          done

      - name: Copy the ZIP to pkgs.hewig.dev
        if: ${{ !github.event.release.prerelease }}
        uses: ./.github/actions/r2-packages
        with:
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          destination: windows
          files: packages/*.zip packages/*.zip.sha256

      # winget pins the hash of the bytes pkgs.hewig.dev serves.
      - name: Write winget manifests
        if: ${{ !github.event.release.prerelease }}
        run: |
          version=${TAG_NAME#v}
          [[ $version =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "winget needs a numeric version, got $version" >&2; exit 1; }
          export VERSION="$version"
          export URL_X64="https://pkgs.hewig.dev/windows/JayJay-$version-windows-x64.zip"
          export URL_ARM64="https://pkgs.hewig.dev/windows/JayJay-$version-windows-arm64.zip"
          SHA256_X64=$(curl -fsSL "$URL_X64" | sha256sum | cut -d' ' -f1 | tr a-f A-F)
          SHA256_ARM64=$(curl -fsSL "$URL_ARM64" | sha256sum | cut -d' ' -f1 | tr a-f A-F)
          export SHA256_X64 SHA256_ARM64
          dir="winget/manifests/h/hewig/JayJay/$version"
          mkdir -p "$dir"
          for template in dist/windows/winget/*.yaml; do
            manifest="$dir/${template##*/}"
            # shellcheck disable=SC2016 # Only these variables; the templates' $schema headers must stay literal.
            envsubst '$VERSION $URL_X64 $SHA256_X64 $URL_ARM64 $SHA256_ARM64' <"$template" >"$manifest"
          done

      - name: Upload winget manifests
        if: ${{ !github.event.release.prerelease }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: winget
          if-no-files-found: error
