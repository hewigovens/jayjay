name: WASM CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/wasm-ci.yml"
      - "justfile"
      - "shell/justfile"
      - "**/*.just"
      - "scripts/llvm-clang"
      - "scripts/build-diff-web.sh"
      - "scripts/grammar-wasm.sh"
      - "scripts/test-wasm.sh"
      - "scripts/web-grammar-parity.mjs"
      - "scripts/web-grammars.sh"
      - "scripts/with-wasm-toolchain.sh"
      - "scripts/wasm-bindgen-version.sh"
      - "web/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/wasm-ci.yml"
      - "justfile"
      - "shell/justfile"
      - "**/*.just"
      - "scripts/llvm-clang"
      - "scripts/build-diff-web.sh"
      - "scripts/grammar-wasm.sh"
      - "scripts/test-wasm.sh"
      - "scripts/web-grammar-parity.mjs"
      - "scripts/web-grammars.sh"
      - "scripts/with-wasm-toolchain.sh"
      - "scripts/wasm-bindgen-version.sh"
      - "web/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: wasm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Link WASM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: llvm-tools

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just

      - name: Link portable WASM library
        run: just test-wasm

  review-web:
    name: Review web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: llvm-tools

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: review-web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test review session
        run: cargo test --locked -p jj-diff-web

      # Each cached grammar's name hashes its source version, the tree-sitter CLI version, and the build scripts, so a restored older cache only reuses grammars that are unchanged; the build prunes the rest. The CLI caches the WASI SDK here too.
      - name: Cache web grammars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/jayjay-web-grammars
            ~/.cache/tree-sitter
          key: web-grammars-${{ hashFiles('Cargo.lock', 'scripts/web-grammars.sh', 'scripts/grammar-wasm.sh', 'crates/jj-diff/grammars/fluent/**') }}
          restore-keys: web-grammars-

      - name: Read wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(bash scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build and check the web review
        run: |
          export JAYJAY_GRAMMAR_CACHE="$HOME/.cache/jayjay-web-grammars"
          npm ci
          npm run format:check
          npm run build --workspace @jayjay/review-host
          npm run check --workspaces
          npm test --workspace @jayjay/diff

      - name: Compare web and native highlighting
        run: node scripts/web-grammar-parity.mjs

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-web-build
          path: |
            web/review-host/dist
            web/review/src/wasm
          retention-days: 1
          if-no-files-found: error

  browser:
    name: Browser tests
    needs: review-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image ships the browsers and their system libraries, which took up to 13 minutes to install from the Ubuntu mirrors.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.review-web.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-web-build
          path: web

      - name: Install packages
        run: npm ci

      - name: Test in Chromium and WebKit
        working-directory: web/review-host
        run: npm run test:browser

      - name: Test JayJay Diff on phones
        working-directory: web/diff
        run: npm run test:browser
