name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  upload:
    name: benchmark (push, ${{ matrix.scenario }})
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # crates/jj-diff/benches/profile_diff.rs scenarios, each its own `jj-diff-<scenario>` series.
        # Keep in sync with the report job and the relay matrix in hotpath-relay.yml.
        scenario: [warm, expand, wrap, sbs]
    permissions:
      contents: read
      id-token: write
    env:
      HOTPATH_BENCHMARK: jj-diff-${{ matrix.scenario }}
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.99.0,profile=bench,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
      BENCH_ARGS: -p jj-diff --bench profile_diff --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      # Callgrind needs symbols; [profile.release] strips them.
      CARGO_PROFILE_BENCH_STRIP: none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: cargo bench -q $BENCH_ARGS --no-run
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: cargo bench -q $BENCH_ARGS -- ${{ matrix.scenario }}
      - name: Run benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload.json
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=${{ runner.temp }}/callgrind.out.%p
        run: |
          cargo bench -q $BENCH_ARGS -- ${{ matrix.scenario }}
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null

  report:
    name: benchmark (pull request, ${{ matrix.scenario }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [warm, expand, wrap, sbs]
    permissions:
      contents: read
    env:
      HOTPATH_BENCHMARK: jj-diff-${{ matrix.scenario }}
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.99.0,profile=bench,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
      BENCH_ARGS: -p jj-diff --bench profile_diff --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      CARGO_PROFILE_BENCH_STRIP: none
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: cargo bench -q $BENCH_ARGS --no-run
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: cargo bench -q $BENCH_ARGS -- ${{ matrix.scenario }}
      - name: Run benchmark under Callgrind and write the merged report
        env:
          # Absolute: cargo bench starts the binary in crates/jj-diff.
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/report.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=${{ runner.temp }}/callgrind.out.%p
        run: |
          cargo bench -q $BENCH_ARGS -- ${{ matrix.scenario }}
          test -s report.json
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            report.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          # One artifact per scenario; the relay matrix picks it by name.
          name: hotpath-report-${{ matrix.scenario }}
          path: report.json
          retention-days: 1
          if-no-files-found: error
