name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - "crates/jj-diff/**"
      - "crates/jayjay-i18n/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/hotpath-benchmark.yml"
      - "hotpath/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-main
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.99.0,profile=bench,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
      # Callgrind needs symbols; [profile.release] strips them.
      CARGO_PROFILE_BENCH_STRIP: none
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build and measure scenarios
        shell: bash
        run: |
          bench_args=(--locked -q -p jj-diff --bench profile_diff --features "hotpath-alloc,hotpath-cloud,hotpath-callgrind")
          cargo bench "${bench_args[@]}" --no-run
          for scenario in warm expand wrap sbs; do
            (
              echo "::group::$scenario"
              report_dir="$RUNNER_TEMP/hotpath/$scenario"
              mkdir -p "$report_dir"
              export HOTPATH_BENCHMARK="jj-diff-$scenario"
              HOTPATH_OUTPUT_PATH="$report_dir/native.json" cargo bench "${bench_args[@]}" -- "$scenario"

              export HOTPATH_OUTPUT_PATH="$report_dir/report.json"
              export HOTPATH_MERGE_REPORT="$report_dir/native.json"
              export HOTPATH_CALLGRIND_OUT_FILE="$report_dir/callgrind.out.%p"
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=$report_dir/callgrind.out.%p"
              export HOTPATH_UPLOAD=fail-on-error
              export HOTPATH_UPLOAD_RESPONSE_PATH="$report_dir/upload.json"
              cargo bench "${bench_args[@]}" -- "$scenario"
              test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
              jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
                "$HOTPATH_OUTPUT_PATH" > /dev/null
              echo "::endgroup::"
            )
          done
