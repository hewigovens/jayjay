name: JayJay
options:
  bundleIdPrefix: com.jayjay
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

packages:
  JayJayCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

schemes:
  JayJay:
    build:
      targets:
        JayJay: all
    run:
      config: Debug

targets:
  JayJay:
    type: application
    platform: macOS
    sources:
      - Sources/JayJay
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: JayJayCore
        product: JayJayCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: app
        PRODUCT_BUNDLE_IDENTIFIER: com.jayjay.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JayJay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: "5.10"
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Open Repository
            CFBundleURLSchemes:
              - jayjay
        SUFeedURL: https://raw.githubusercontent.com/hewigovens/jayjay/main/docs/appcast.xml
        SUPublicEDKey: UOMJSZnts1cRolglWcFAcibe9T9dD9flzz7fAQ3jmoQ=
