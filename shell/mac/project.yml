name: JayJay
options:
  bundleIdPrefix: com.jayjay
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

packages:
  JayJayCore:
    path: .
  JayJayDiffUI:
    path: Packages/JayJayDiffUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

schemes:
  JayJay:
    build:
      targets:
        JayJay: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JayJayTests
    run:
      config: Debug

  JayJayUITests:
    build:
      targets:
        JayJay: all
        JayJayUITests: test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JayJayUITests
    run:
      config: Debug

targets:
  JayJay:
    type: application
    platform: macOS
    sources:
      - Sources/JayJay
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: JayJayCore
        product: JayJayCore
      - package: JayJayDiffUI
        product: JayJayDiffUI
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: app
        PRODUCT_BUNDLE_IDENTIFIER: dev.hewig.jayjay
        MARKETING_VERSION: "0.2.22"
        CURRENT_PROJECT_VERSION: 27
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JayJay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: "5.10"
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Open Repository
            CFBundleURLSchemes:
              - jayjay
        SUFeedURL: https://raw.githubusercontent.com/hewigovens/jayjay/main/docs/appcast.xml
        SUPublicEDKey: UOMJSZnts1cRolglWcFAcibe9T9dD9flzz7fAQ3jmoQ=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false

  JayJayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/JayJayTests
    hostApplication: JayJay
    dependencies:
      - target: JayJay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  JayJayUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/JayJayUITests
      - path: Sources/JayJay/Shared/AccessibilityIdentifiers.swift
        buildPhase: sources
    dependencies:
      - target: JayJay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JayJay
