[package]
name = "jayjay-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"
publish = false

[[bin]]
name = "jayjay-gpui"
path = "src/main.rs"

[dependencies]
jayjay-core = { path = "../../crates/jayjay-core" }
jayjay-i18n = { path = "../../crates/jayjay-i18n" }
jayjay-markdown = { path = "../../crates/jayjay-markdown" }
jayjay-network = { path = "../../crates/jayjay-network", features = ["blocking"] }
jayjay-review = { path = "../../crates/jayjay-review" }
gpui = { workspace = true }
# font-kit/runtime_shaders are macOS-only forwards; wayland/x11 enable the Linux
# windowing backends (no-ops elsewhere). Without them the Linux binary cannot open a window.
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
chrono = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
dunce = { workspace = true }
image = { workspace = true }
resvg = "0.46"
font-kit = "0.14"
hex = "0.4"
log = "0.4"
notify = "8"
open = "5"
sys-locale = { workspace = true }
flume = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14", features = ["source-fontconfig-default"] }
libc = { workspace = true }
notify-rust = "4.18.0"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
jayjay-core = { path = "../../crates/jayjay-core", features = ["mock"] }
gpui = { workspace = true, features = ["test-support"] }
jj-test = { path = "../../crates/jj-test" }
tempfile = { workspace = true }
