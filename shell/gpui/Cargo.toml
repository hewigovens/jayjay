[package]
name = "jayjay-gpui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "jayjay-gpui"
path = "src/main.rs"

[dependencies]
jayjay-core = { path = "../../crates/jayjay-core" }
jayjay-markdown = { path = "../../crates/jayjay-markdown" }
jayjay-network = { path = "../../crates/jayjay-network" }
jayjay-review = { path = "../../crates/jayjay-review" }
gpui = { git = "https://github.com/hewigovens/zed", rev = "2db32707ecac6e8e36977fc2d4d061c17719f21d" }
# font-kit/runtime_shaders are macOS-only forwards; wayland/x11 enable the Linux
# windowing backends (no-ops elsewhere). Without them the Linux binary cannot open a window.
gpui_platform = { git = "https://github.com/hewigovens/zed", rev = "2db32707ecac6e8e36977fc2d4d061c17719f21d", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
chrono = { workspace = true }
font-kit = "0.14"
md-5 = "0.11"
hex = "0.4"
directories = { workspace = true }
notify = "8"
flume = "0.12"
serde = { workspace = true }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
gpui = { git = "https://github.com/hewigovens/zed", rev = "2db32707ecac6e8e36977fc2d4d061c17719f21d", features = ["test-support"] }
jj-test = { path = "../../crates/jj-test" }
tempfile = { workspace = true }
serde_json = { workspace = true }
