[package]
name = "jayjay-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"
publish = false

[[bin]]
name = "jayjay-gpui"
path = "src/main.rs"

[dependencies]
jayjay-core = { path = "../../crates/jayjay-core" }
jayjay-markdown = { path = "../../crates/jayjay-markdown" }
jayjay-network = { path = "../../crates/jayjay-network", features = ["blocking"] }
jayjay-review = { path = "../../crates/jayjay-review" }
gpui = { git = "https://github.com/hewigovens/zed", rev = "2591bc726f91d0e965ed812d92e3ec123ca1fee5" }
# font-kit/runtime_shaders are macOS-only forwards; wayland/x11 enable the Linux
# windowing backends (no-ops elsewhere). Without them the Linux binary cannot open a window.
gpui_platform = { git = "https://github.com/hewigovens/zed", rev = "2591bc726f91d0e965ed812d92e3ec123ca1fee5", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
percent-encoding = { workspace = true }
font-kit = "0.14"
md-5 = "0.11"
hex = "0.4"
directories = { workspace = true }
notify = "8"
open = "5"
flume = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { version = "0.14", features = ["source-fontconfig-default"] }
notify-rust = "4.18.0"

[dev-dependencies]
gpui = { git = "https://github.com/hewigovens/zed", rev = "2591bc726f91d0e965ed812d92e3ec123ca1fee5", features = ["test-support"] }
jj-test = { path = "../../crates/jj-test" }
tempfile = { workspace = true }
