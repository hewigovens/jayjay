# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: hewig.JayJay
PackageVersion: "${VERSION}"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: jayjay.exe
  PortableCommandAlias: jayjay
- RelativeFilePath: jayjay-gpui.exe
  PortableCommandAlias: jayjay-gpui
# Windows 10 1903 is the oldest release that ships the ICU DLLs the app imports.
MinimumOSVersion: 10.0.18362.0
Dependencies:
  PackageDependencies:
  - PackageIdentifier: jj-vcs.jj
Installers:
- Architecture: x64
  InstallerUrl: "${URL}"
  InstallerSha256: ${SHA256}
ManifestType: installer
ManifestVersion: 1.10.0
