[package]
name = "jayjay-core"
version = "0.1.0"
description = "Core repository operations for JayJay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["repository", "watchman"]
repository = [
    "dep:chrono",
    "dep:csv",
    "dep:directories",
    "dep:dunce",
    "dep:etcetera",
    "dep:futures",
    "dep:gix",
    "dep:gix-url",
    "dep:gethostname",
    "jayjay-network/blocking",
    "dep:jayjay-review",
    "dep:jj-lib",
    "dep:libc",
    "dep:percent-encoding",
    "dep:plist",
    "dep:pollster",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
    "dep:shell-words",
    "dep:stacker",
    "dep:tempfile",
    "dep:toml",
    "jayjay-review/storage",
    "jj-lib/git",
]
watchman = ["repository", "jj-lib/watchman"]

[dependencies]
jj-lib = { workspace = true, optional = true }
gix = { workspace = true, optional = true }
gix-url = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
jj-diff = { version = "0.1.0", path = "../jj-diff" }
jayjay-primitives = { version = "0.1.0", path = "../jayjay-primitives" }
jayjay-review = { version = "0.1.0", path = "../jayjay-review", optional = true }
jayjay-network = { version = "0.1.0", path = "../jayjay-network", default-features = false, optional = true }
nucleo-matcher = { workspace = true }
pollster = { workspace = true, optional = true }
stacker = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
plist = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
etcetera = { workspace = true, optional = true }
gethostname = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }
sapling-renderdag = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jj-test = { path = "../jj-test" }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
