[package]
name = "jayjay-core"
version = "0.1.0"
publish = false
description = "Core repository operations for JayJay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["repository", "watchman"]
mock = []
repository = [
    "dep:base64",
    "dep:chrono",
    "dep:csv",
    "dep:dunce",
    "dep:etcetera",
    "dep:futures",
    "dep:gix",
    "dep:gix-url",
    "dep:gethostname",
    "jayjay-network/blocking",
    "jayjay-network/json",
    "dep:jayjay-review",
    "dep:jj-lib",
    "dep:libc",
    "dep:parking_lot",
    "dep:percent-encoding",
    "dep:plist",
    "dep:pollster",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
    "dep:clap",
    "dep:shell-words",
    "dep:stacker",
    "dep:tempfile",
    "jayjay-review/storage",
    "jj-lib/git",
]
watchman = ["repository", "jj-lib/watchman"]
hotpath = ["dep:hotpath", "hotpath/hotpath", "jj-diff/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
icu_decimal = { version = "2.3", features = ["alloc"] }
icu_locale_core = "2.3"
base64 = { workspace = true, optional = true }
hotpath = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
jj-lib = { workspace = true, optional = true }
gix = { workspace = true, optional = true }
gix-url = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
jj-diff = { version = "0.1.0", path = "../jj-diff" }
jayjay-primitives = { version = "0.1.0", path = "../jayjay-primitives" }
jayjay-review = { version = "0.1.0", path = "../jayjay-review", optional = true }
jayjay-network = { version = "0.1.0", path = "../jayjay-network", default-features = false, optional = true }
nucleo-matcher = { workspace = true }
parking_lot = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
stacker = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
plist = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
etcetera = { workspace = true, optional = true }
gethostname = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[[bench]]
name = "profile_refresh"
harness = false
required-features = ["repository"]

[dev-dependencies]
jayjay-network = { path = "../jayjay-network", features = ["mock"] }
jj-test = { path = "../jj-test" }

[lints]
workspace = true
