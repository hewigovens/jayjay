[package]
name = "jayjay-review"
version = "0.1.0"
publish = false
description = "Local review state and note reconciliation for JayJay"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["storage", "all-languages"]
all-languages = ["jj-diff/all-languages"]
storage = []

[dependencies]
jayjay-primitives = { version = "0.1.0", path = "../jayjay-primitives" }
jj-diff = { version = "0.1.0", path = "../jj-diff", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = "0.4"
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
