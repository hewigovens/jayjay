[package]
name = "jayjay-uniffi"
version = "0.1.0"
description = "UniFFI bindings for JayJay core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
jayjay-core = { version = "0.1.0", path = "../jayjay-core" }
jayjay-markdown = { version = "0.1.0", path = "../jayjay-markdown" }
jayjay-primitives = { version = "0.1.0", path = "../jayjay-primitives" }
jayjay-review = { version = "0.1.0", path = "../jayjay-review" }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }
