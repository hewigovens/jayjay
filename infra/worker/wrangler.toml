name = "jayjay"
main = "./build/index.js"
compatibility_date = "2026-06-01"

[build]
command = "worker-build --release -- --locked"

# Real appcast the /appcast.xml route proxies to.
[vars]
APPCAST_ORIGIN = "https://raw.githubusercontent.com/hewigovens/jayjay/main/docs/appcast.xml"

[[d1_databases]]
binding = "DB"
database_name = "jayjay_stats"
database_id = "d9051c69-6cce-4504-bb87-c06a08f9b950"

# HASH_SECRET is a secret, NOT a var:  wrangler secret put HASH_SECRET
