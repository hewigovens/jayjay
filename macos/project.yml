name: JayJay
options:
  bundleIdPrefix: com.jayjay
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  JayJayBindings:
    path: .

targets:
  JayJay:
    type: application
    platform: macOS
    sources:
      - Sources/JayJay
    dependencies:
      - package: JayJayBindings
        product: JayJayBindings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayjay.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JayJay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: "5.10"
