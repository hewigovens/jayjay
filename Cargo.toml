[workspace]
members = ["crates/jayjay-core", "crates/jayjay-uniffi"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
jj-lib = "0.39"
uniffi = "0.31"
thiserror = "2"
pollster = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
futures = "0.3"
