[workspace]
members = ["crates/jayjay-markdown", "crates/jj-diff", "crates/jj-test", "crates/jayjay-network", "crates/jayjay-primitives", "crates/jayjay-review", "crates/jayjay-core", "crates/jayjay-uniffi", "crates/jayjay-cli", "shell/gpui"]
resolver = "2"

[workspace.package]
version = "0.3.17"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/hewigovens/jayjay"

[workspace.dependencies]
async-trait = "0.1"
jj-lib = { version = "0.45.1", default-features = false }
gix = { version = "0.87.1", default-features = false }
gix-url = "0.38.0"
percent-encoding = "2.3.2"
ureq = "3"
uniffi = { version = "0.32", default-features = false }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
pollster = "1.0"
stacker = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
tempfile = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = { version = "1.10", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
csv = "1.4"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39"
similar = "3.2"
unicode-width = "0.2"
unicode-segmentation = "1"
nucleo-matcher = "0.3"
toml = "1.1"
directories = "6"
pulldown-cmark = { version = "0.13", default-features = false }
dunce = "1"
etcetera = "0.11"
gethostname = "1"
rand = "0.10"
shell-words = "1.1.1"

tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-php = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-swift = "0.7"
tree-sitter-solidity = "1.2"
tree-sitter-sequel = "0.3"
tree-sitter-xml = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-make = "1.1"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256
lto = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.clippy]
too_many_lines = "warn"
