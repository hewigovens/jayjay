[workspace]
members = ["crates/jayjay-markdown", "crates/jj-diff", "crates/jj-test", "crates/jayjay-network", "crates/jayjay-primitives", "crates/jayjay-review", "crates/jayjay-core", "crates/jayjay-uniffi", "crates/jayjay-cli", "shell/gpui"]
resolver = "2"

[workspace.package]
version = "0.3.14"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/hewigovens/jayjay"

[workspace.dependencies]
jj-lib = "0.44.0"
gix = { version = "0.85.0", default-features = false }
gix-url = "0.36.1"
percent-encoding = "2.3.2"
ureq = "3"
uniffi = "0.32.0"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
pollster = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
tempfile = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10.0"
csv = "1.4.0"
sha2 = "0.11.0"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39.6"
similar = "3.1.1"
unicode-width = "0.2"
unicode-segmentation = "1"
nucleo-matcher = "0.3"
toml = "1.1"
directories = "6"
pulldown-cmark = { version = "0.13.4", default-features = false }

tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25.1"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-php = "0.24.2"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-swift = "0.7.3"
tree-sitter-solidity = "1.2"
tree-sitter-sequel = "0.3"
tree-sitter-xml = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-make = "1.1"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256
lto = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
